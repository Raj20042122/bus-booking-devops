
name: Bus Booking CI Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:

  test:
    name: Code Quality and Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Checks
        run: ruff check app tests

      - name: Run Pytest
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ github.sha }}
          path: test-results.xml
          if-no-files-found: ignore

  docker-build:
    name: Build Versioned Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t bus-booking-api:${{ github.sha }} .

      - name: Save Docker Image
        run: |
          docker save bus-booking-api:${{ github.sha }} \
          -o bus-booking-api-${{ github.sha }}.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bus-booking-api-${{ github.sha }}
          path: bus-booking-api-${{ github.sha }}.tar
          retention-days: 7
